; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================================
; High-Speed Vibration Data Logger (V2) — WeAct STM32F405RGT6 mini core board
; Framework: STM32 HAL via CubeMX-generated sources (NOT Arduino).
; The CubeMX .ioc + generated code live in src/ ; FatFs ships with the HAL.
; ============================================================================

[env:genericSTM32F405RG]
platform = ststm32
board    = genericSTM32F405RG
framework = stm32cube

; --- Build flags -----------------------------------------------------------
build_flags = 
    ; STM32 HAL driver selection (required by the CubeMX-generated code)
    -DUSE_HAL_DRIVER
    -DSTM32F405xx
    -DHSE_VALUE=8000000    ; <--- ВОТ ЭТА СТРОКА
    ; Cortex-M4F hardware FPU — single-precision VFPv4 (fast float calibration in ISR)
    ;-mcpu=cortex-m4
    ;-mfpu=fpv4-sp-d16
    ;-mfloat-abi=hard
    ; Speed-first optimization for the deterministic 1600 Hz sampling path.
    ; NOTE: -ffast-math relaxes IEEE strictness; acceptable here (calibration math,
    ; no NaN/Inf-dependent logic). Remove if you need bit-exact float behavior.
    -Ofast
    -ffast-math
    -funroll-loops
    ; Expose CMSIS-DSP intrinsics (library provided by the ARM CMSIS package)
    -DCMSIS_DSP

; --- Libraries -------------------------------------------------------------
; FatFs is bundled with the STM32CubeF4 HAL distribution used by framework=stm32cube,
; so no external dependency is required. If your toolchain does not expose it,
; uncomment one of these to pull a standalone copy:
; lib_deps = 
;     https://github.com/CHIBIRETOS/fatfs.git

; --- Upload / monitor ------------------------------------------------------
upload_protocol = stlink
monitor_speed   = 115200


